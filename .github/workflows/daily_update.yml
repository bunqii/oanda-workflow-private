name: Daily OANDA Downloader

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to download (e.g. 5S,1,5,60,D)'
        required: false
        default: '5S,1,5,60,D'
      ticker_filter:
        description: 'Optional: Filter to single ticker (e.g. XAU_USD or BTC_USD). Leave blank for all.'
        required: false
        default: ''

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests "httpx[http2]" h2 numpy pandas pyarrow python-dateutil huggingface_hub

      - name: Configure Git for tracker commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Orchestrator
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          TIMEFRAMES: ${{ inputs.timeframes }}
          TICKER_FILTER: ${{ inputs.ticker_filter }}
        run: |
          python -u orchestrator.py
